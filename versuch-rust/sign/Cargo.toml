[package]
name = "ngc-sign-versuch"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "0.10.9", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }

[profile.release]
panic = "abort"

# The probes are named here rather than left in src/bin/, because the repo's
# .gitignore holds "bin/" and a file nobody can commit is no evidence.
[[bin]]
name = "ngc-sign-versuch"
path = "src/main.rs"

[[bin]]
name = "tiefe"
path = "src/tiefe.rs"
