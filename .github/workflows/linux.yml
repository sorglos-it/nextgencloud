# What this run is for: every check in this repo is done by hand on one Windows
# machine, and that machine has traps of its own - a go1.27 runtime crash that
# is not a finding, dozens of cases that switch themselves off (podman, Linux
# goroutines, symlinks, owners, root), a NAS drive where os.File.Chdir does not
# work, and a virus scanner that gets in the way of freshly built test binaries.
# This run is the other half: Linux, ext4, podman present, a clean machine every
# time. It measures what the Windows machine cannot.
#
# IT ONLY MEASURES. It publishes nothing, pushes nothing, needs no secret, and
# asks for read permission only (see "permissions" below). Anything that would
# need a key does NOT run here and is named in the step that would need it.
name: Linux-Pruefung

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "seconds of real fuzzing per target (0 = seeds only)"
        default: "5"

# Read only. No token with write rights ever reaches a step of this run.
permissions:
  contents: read

# A second push to the same branch cancels the first: a run nobody reads any
# more still costs minutes.
#
# The group is keyed on the BRANCH and not on github.ref, and that is the
# whole point of the line. A branch with an open pull request fires both
# events, and github.ref is not the same string for them -
# "refs/heads/<branch>" for push, "refs/pull/<n>/merge" for pull_request - so
# the two runs landed in two groups and BOTH ran. Measured 20.10.2026 twice:
# the push run and the pull_request run of the same commit started two seconds
# apart and both ran to the end, which is the proof that nothing cancelled
# them. Two full suites at once, two -race runs among them, and the timing
# tests of the tunnel fell over in the pull_request one while the push one was
# green - the same commit, the same content, main unmoved.
#
# github.head_ref is the branch on a pull_request and empty otherwise, and
# github.ref_name is the branch on a push, so both events give one string and
# one of the two runs is cancelled. Every push is still measured, which the
# -race job below says it is there for; what stops is paying twice and
# measuring timing under twice the load.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # The go tool stamps builds with VCS data and runs git for it; the stamp is
  # of no use here and git in a checkout of a fork can fail on it.
  GOFLAGS: -buildvcs=false

jobs:
  # ---------------------------------------------------------------- check
  # Everything "bash tools/check.sh" does on the Windows machine: the structural
  # checks first (a hollow tree, an unparsable file, a file no configuration
  # compiles, a stale line in tools/modules.go, trusttest outside tests), then
  # the PHP case, go vet for three targets, the test suite, and the builds for
  # linux/amd64 and linux/arm64.
  #
  # The test run inside check.sh writes its JSON stream to a file, and
  # tools/ci-count.sh turns it into three numbers: passed, FAILED and SKIPPED.
  # "ok" is not a number of cases.
  check:
    name: check.sh + counted test run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # No credentials are left behind in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # podman: on the Windows machine every case that reads podman's argument
      # list is skipped, and the hardening of the app container - the only wall
      # between an app and the server - was held by nothing at all until that
      # was found (12.10.2026). Here podman is present, so the cases that start
      # it run instead of skipping.
      - name: podman installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
          podman --version

      - name: php nennen
        # check.sh looks php up in four steps and stops if it finds none; the
        # runner image carries one, this makes which one visible.
        run: php -v | head -1

      # BEFORE check.sh, and for the same reason check.sh puts its structural
      # checks before its builds: a counter that counts wrong makes the three
      # minutes after it worthless. This step also asserts that this workflow
      # and check.sh still agree on NGC_CHECK_TEST_JSON - the drift that made
      # 42 of 82 red runs here report "nothing ran" while check.sh was green.
      - name: zaehlwerk selbst pruefen
        run: bash tools/ci-count-test.sh

      - name: check.sh
        env:
          # check.sh writes the JSON stream of its own test run here instead of
          # running the suite a second time just to count it.
          NGC_CHECK_TEST_JSON: ${{ runner.temp }}/test.json
        run: bash tools/check.sh

      - name: zaehlen - bestanden / rot / uebersprungen
        if: always()
        run: bash tools/ci-count.sh "${{ runner.temp }}/test.json" "Linux, normaler Benutzer (podman da)"

      - name: Bericht in die Zusammenfassung
        if: always()
        run: |
          {
            echo '### Linux-Lauf, normaler Benutzer'
            echo '```'
            bash tools/ci-count.sh "${{ runner.temp }}/test.json" "Linux, normaler Benutzer" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- root
  # The controller makes system users, hands directories to them and encrypts
  # them - all of that needs root, and on the Windows machine every one of those
  # cases says so and skips. A GitHub runner gives root for free, so they run
  # here, in a job of their own: running the WHOLE suite as root would change
  # what other cases measure (several assert exactly that they are NOT root).
  root:
    name: controller cases that need root
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: podman installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
      - name: als root
        run: |
          sudo -E env "PATH=$PATH" "GOFLAGS=$GOFLAGS" \
            go test -count=1 -json ./apps/server-controller/... > "${{ runner.temp }}/root.json" || true
      - name: zaehlen
        run: NGC_COUNT_FLOOR=50 bash tools/ci-count.sh "${{ runner.temp }}/root.json" "Linux als root (controller)"

  # ---------------------------------------------------------------- race
  # The race detector needs cgo and a C compiler. On the Windows machine that
  # compiler exists only inside the ESP toolchain and had to be hunted for; here
  # it is simply there, so the Linux goroutines are measured on every push.
  #
  # shared/trust is left out ON PURPOSE and the reason is measured
  # (12.10.2026): TestSignatureBeforeDecoding asserts a memory ceiling, and the
  # instrumentation of the race detector itself takes more than the ceiling
  # allows (65736 bytes against about 65544). It is not a race - over the other
  # 30 packages the run shows 0 DATA RACE. The package is run WITHOUT -race in
  # the step after, so it is not quietly dropped.
  race:
    name: -race (Linux goroutines)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: -race ueber alles ausser shared/trust
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v '^github.com/sorglos-it/nextgencloud/shared/trust$')
          n=$(printf '%s\n' "$pkgs" | grep -c .)
          # A package list that comes back nearly empty is a failed list, not a
          # small repo: go list answers "packages=0" when it cannot stat a tree.
          [ "$n" -ge 20 ] || { echo "go list named only $n packages - the list failed"; exit 1; }
          CGO_ENABLED=1 go test -count=1 -race -json $pkgs > "${{ runner.temp }}/race.json" || true
      - name: zaehlen
        run: bash tools/ci-count.sh "${{ runner.temp }}/race.json" "Linux mit -race (ohne shared/trust)"
      - name: shared/trust ohne -race
        run: go test -count=1 ./shared/trust/...

  # ---------------------------------------------------------------- fuzz
  # NOT a search - a fallback check. The seed corpus of every target already
  # runs as ordinary cases in the job above; this adds a few seconds of real
  # fuzzing per target so a seed that was checked in after a crash keeps being
  # exercised.
  #
  # The budget is deliberate: there are about 90 targets, go fuzzes ONE at a
  # time, and a run that takes 40 minutes gets switched off instead of read. Four
  # shards times about 23 targets times the default 5 s is roughly 2-4 minutes of
  # wall clock per shard. -fuzzminimizetime 0 keeps a found input from eating 60
  # seconds of the budget on minimizing.
  #
  # COST, because that decides whether a run gets read or switched off: measured
  # 18.10.2026 on four cores with a cold build cache, which is what a runner is.
  # check.sh 148 s, the controller cases 90 s, -race 383 s, one fuzz shard 231 s.
  # With four shards on every push that is about 30 billed minutes per push at
  # roughly 8 minutes of wall clock. So the fuzz job runs on the DEFAULT BRANCH
  # and by hand, not on every push of every branch: that halves the bill and the
  # seed corpus of every target still runs as ordinary cases in the check job
  # above, on every push. Drop the "if:" line to fuzz on every push.
  fuzz:
    name: fuzz (fallback, shard ${{ matrix.shard }}/4)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzzen
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '5' }}
          SHARD: ${{ matrix.shard }}
        run: bash tools/ci-fuzz.sh

  # ---------------------------------------------------------------- web
  # The Playwright suite ran in NO step of this file until 3.11.2026, and that
  # was measured, not assumed: neither "playwright" nor "web/tests" appeared
  # anywhere here, and tools/check.sh runs only the two node/php one-liners.
  # So every green number for the web shell came from a run somebody started by
  # hand on the Windows machine. This job is the other half for the browser.
  #
  # All three engines run, and the numbers are reported PER ENGINE, because a
  # single total hides what the strand measured on 3.11.2026: on webkit 1 of 22
  # cases of the login suite actually runs and 21 switch themselves off, so a
  # total of "22 passed, 0 failed" would read as three engines when it is one.
  # The skips are legitimate (Playwright's firefox cannot build an Ed25519
  # public half out of a PKCS#8 seed, its webkit cannot generateKey at all) -
  # but they are skips, and a skipped case is not a case that ran.
  #
  # The floor is what keeps a silently empty run from passing: playwright, like
  # go test, exits 0 for a run in which everything switched itself off.
  web:
    # One job per engine, and the reason is measured: all three in one job ran
    # 25 minutes into the timeout without reaching the counter (run
    # 41703511513, 3.11.2026 - php 8.3.6 and all three browsers installed
    # fine, the suite itself did not finish). Sharded, each engine also
    # reports its own numbers under its own name, which is what this job is
    # for: a single total hides which engine carried it.
    name: web shell (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # 20 minutes, and the number is measured, not chosen: a full suite per
    # engine on the Windows machine takes 542 s (chromium), 469 s (firefox),
    # 561 s (webkit) at a7d7b384 - 1572 s together, which is also why all
    # three in one job died 1.2 minutes past a 25-minute limit (run
    # 41703511513): the suite was not hanging, it was nearly done. The longest
    # engine is 561 s, so this is a factor of 2.1 over the slowest measured
    # shard, on a machine that is not this runner.
    #
    # 30 since 7.11.2026, and the number moved because the measurement did:
    # playwright.config.js retries a failed case twice on CI, and the retries
    # are paid for in this same job. Firefox needed 11.0 min with 23 red at run
    # 42368451560, so retrying those puts roughly four minutes on top.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: php und node-pakete
        run: |
          php -v
          npm ci
        working-directory: apps/web/tests
      - name: browser holen
        # Only the engine of this shard, not all three: the other two would be
        # downloaded and never started.
        run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: apps/web/tests
      - name: laufen
        env:
          # A port of its own PER SHARD, as the config asks for: the three
          # shards are three runners today, but a run that finds a server
          # already answering measures another working tree, and that is
          # exactly the trap the config was written against. 8161/8171/8181
          # keep them apart whatever the runner does.
          NGC_WEB_TEST_PORT: ${{ matrix.engine == 'chromium' && '8161' || matrix.engine == 'firefox' && '8171' || '8181' }}
          # The reporter writes to a FILE, not to stdout. Measured in run
          # 41716631146: all three shards died at the counter with
          # "Unexpected token 'G', \"GitCommitI\"..." - playwright prints its
          # own git-commit-info line to stdout before the JSON, so a plain
          # redirect produces a file that is not JSON. The counter caught it
          # because an unreadable report is red there; a counter that only
          # looked for failures would have found none and said nothing.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/web.json
        run: npx playwright test --project=${{ matrix.engine }} --reporter=json || true
        working-directory: apps/web/tests
      - name: zaehlen
        # No number yet ON PURPOSE. A floor is a measured value, and the real
        # per-engine counts of this suite on Linux have never been read - the
        # suite has only ever run on the Windows machine. Until the first run
        # here prints them, the only bar is "not a single case ran", which
        # needs no number to be wrong. The number goes in afterwards, with the
        # run it came from named beside it.
        run: node tools/ci-count-web.mjs "${{ runner.temp }}/web.json"
      - name: spuren hochladen
        # The traces are made (playwright.config.js, trace:
        # "retain-on-failure") and were thrown away with the runner. Two webkit
        # cases fail reproducibly with "Target page, context or browser has
        # been closed" on their FIRST page.evaluate, and the log holds no crash
        # line, no timeout and no timing: when a trace is the only record of
        # what the page last did, keeping it is the difference between a cause
        # and a guess. if: failure() only, so a green run uploads nothing.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-spuren-${{ matrix.engine }}
          path: apps/web/tests/test-results/
          retention-days: 7
          if-no-files-found: ignore
