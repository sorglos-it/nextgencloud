# The Apache virtual host of the NGC web interface.
#
# WHAT IT IS FOR. public/index.php says "Apache's DocumentRoot is this folder
# and serves everything below assets/ itself". Until this file existed the
# repository never said what that Apache looks like, so whoever set NGC up
# invented it - and the files below assets/ went out with no wall of their own,
# because classes/Page.php only ever reaches the answers index.php writes.
#
# HOW TO USE IT. Three steps, and there is nothing in here you have to
# understand first:
#
#   1. Copy this file:
#        cp apache-vhost.conf /etc/apache2/sites-available/ngc.conf
#   2. Replace every NGC-HOSTNAME in it with the name this server answers to,
#      the same name the certificate is for (for example ngc.example.com):
#        sed -i 's/NGC-HOSTNAME/ngc.example.com/g' /etc/apache2/sites-available/ngc.conf
#   3. Switch it on and reload:
#        a2enmod ssl headers proxy proxy_http proxy_balancer proxy_wstunnel lbmethod_byrequests
#        a2ensite ngc
#        apachectl configtest
#        systemctl reload apache2
#
# Those are the modules this file and the API's own file need, and no others:
# nothing in here uses mod_rewrite.
#
# Three things have to be there before step 3, and Apache says so if they are
# not:
#
#   - The interface, unpacked at /var/www/ngc/ (so this file's DocumentRoot,
#     /var/www/ngc/public, exists). Owner root, readable by www-data; Apache
#     needs to read it and nothing needs to write it.
#   - A certificate for NGC-HOSTNAME. The simplest way by hand is to fetch it
#     BEFORE this file is in place, with Apache stopped:
#       systemctl stop apache2
#       certbot certonly --standalone -d ngc.example.com
#     Then nothing in here has to make room for the check. For a self-signed or
#     an imported certificate, point the two SSLCertificate… lines below at
#     your own files instead.
#   - PHP: `apt install libapache2-mod-php` is enough, and then nothing here
#     changes. With php-fpm instead, add the SetHandler block that is commented
#     out below.
#
# On a server that ulh set up none of this is done by hand: scripts/ngc-web.sh
# in the ulh repository does it (shared/ulh.md).

# ------------------------------------------------------------------- plain http
#
# Nothing is answered here. NGC needs https for the login (WebAuthn works
# nowhere else), so a request that arrives without TLS is sent on and not
# served.
<VirtualHost *:80>
    ServerName NGC-HOSTNAME
    Redirect 308 / https://NGC-HOSTNAME/
</VirtualHost>

<VirtualHost *:443>
    ServerName NGC-HOSTNAME

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/NGC-HOSTNAME/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/NGC-HOSTNAME/privkey.pem
    # TLS 1.3 and nothing else. The price, in one sentence: a browser older
    # than about 2018 cannot connect - and such a browser cannot log in to NGC
    # anyway, because it has neither WebAuthn nor the keys the session needs.
    SSLProtocol -all +TLSv1.3

    # The server says nothing about itself. ServerTokens is the other half of
    # this and is only allowed in the server-wide configuration, not here - on
    # Debian it is in /etc/apache2/conf-available/security.conf:
    #     ServerTokens Prod
    # PHP's half is expose_php = Off in php.ini. classes/Page.php already
    # removes X-Powered-By from every answer it writes, so this is about the
    # answers PHP gives WITHOUT reaching it: a fatal error, a request that
    # never got to index.php.
    ServerSignature Off

    DocumentRoot "/var/www/ngc/public"

    # WHAT MAY NOT BE SERVED, said twice: once by DocumentRoot pointing at
    # public/ and nothing else, and once here. The second time is the one that
    # survives a typo in the first.
    #
    # Everything beside public/ is for the server itself and for nobody
    # outside:
    #   classes/    the PHP that reads the configuration and sends the headers
    #   config/     settings
    #   data/       runtime data
    #   templates/  the page skeletons, and this file
    #   assets/     the pages of the apps NGC ships. They are NOT under
    #               public/ on purpose: an .html under public/ would be a
    #               document of the shell's own origin, with the shell's
    #               storage, cookies and session in reach - which is exactly
    #               what an app window takes away from an app.
    #   VERSION     the only file above public/ whose content goes out, and
    #               index.php reads it and checks it before it does
    #
    # This closes the way in over http and nothing else. index.php goes on
    # reading classes/, templates/ and VERSION off the file system the way it
    # always did - that is PHP opening a file, not a request Apache answers.
    <Directory "/var/www/ngc">
        Require all denied
        AllowOverride None
        Options None
    </Directory>

    <Directory "/var/www/ngc/public">
        Require all granted
        # No .htaccess anywhere: a file in the tree must not be able to loosen
        # what stands here. tests/shell/csp.spec.js holds the web root to
        # carrying no .ht* file either.
        AllowOverride None
        # No directory listing, and no symbolic link out of the web root. The
        # price: if your installation puts a link into public/ instead of the
        # file, Apache refuses it - copy the file.
        Options -Indexes -FollowSymLinks -ExecCGI -Includes
        # Every path that is not a file below public/ goes to the one entry
        # point, which is what index.php's comment describes. A missing file
        # under assets/ lands there too, so index.php answers it - with the
        # 404 of the shell and the headers classes/Page.php sends, instead of
        # Apache's own bare error page.
        #
        # ONE THING IS NOT MEASURED HERE, because this repository has no Apache
        # to measure: whether the assets block below ALSO reaches that fallback
        # answer and replaces its policy with the assets policy. It makes no
        # difference either way - both policies begin with default-src 'none',
        # and that, together with nosniff and the resource policy, is what
        # tests/shell/csp.spec.js holds that path to.
        FallbackResource /index.php
    </Directory>

    # THE WALLS FOR THE FILES APACHE HANDS OUT ITSELF.
    #
    # Everything below is a file no PHP ever sees: a .js, a .css, the vendored
    # code, and the LICENSE beside it. classes/Page.php cannot reach them, so
    # their walls stand here - and they are NOT the same walls, because a file
    # is not a document and a header written for a document can be wrong for a
    # file. What each one does here was checked, not copied:
    #
    #   X-Content-Type-Options: nosniff
    #       Needed, and one file in the tree proves it:
    #       assets/vendor/noble-hashes/LICENSE has no extension. Measured on
    #       the test server, it goes out with NO Content-Type at all; Apache
    #       2.4 answers the same way, because it has no DefaultType either and
    #       sends no type it cannot look up. Without nosniff the browser is
    #       then free to guess what it is holding, and a file read as something
    #       other than what it is has been the whole attack often enough.
    #
    #   Cross-Origin-Resource-Policy: same-origin
    #       Needed. Without it any page anywhere may pull the shell's files
    #       into itself. They carry no secret, but they are the shell's, and
    #       what is embedded can be measured.
    #
    #   Content-Security-Policy: default-src 'none'; script-src 'self'
    #       A policy OF ITS OWN, not Page::CSP, and the two directives are all
    #       there is on purpose.
    #
    #       For a .js or a .css that a document FETCHES this header does
    #       nothing at all - the policy that governs a sub-resource is the
    #       document's, not the file's. It would be decoration, and a header
    #       that feigns a wall is worse than no header.
    #
    #       It is here for the one file where it is NOT decoration: a worker's
    #       policy is its OWN response's. assets/js/auth/argon2-worker.js is
    #       the module worker that holds the typed password while it derives
    #       the key from it. These two directives let it load what it imports
    #       and let it do nothing else.
    #
    #       Both halves were measured, and they need both engines:
    #         - script-src 'self' is what keeps the worker working. With
    #           "default-src 'none'" ALONE, WebKit refuses the worker's static
    #           import outright - the worker never runs, so no password login
    #           works in Safari. Chromium is the quiet one: it lets the static
    #           import through and refuses only a dynamic import(). A header
    #           measured on one engine would have shipped the wrong value here.
    #         - connect-src is ABSENT, so default-src 'none' answers for it,
    #           and fetch out of such a worker is refused on both engines
    #           (measured). That is the wall that matters: nowhere to send the
    #           password, even if this file or something it imports were one day
    #           made to try.
    #
    #       That is also why Page::CSP is wrong here: it says script-src,
    #       style-src, img-src, connect-src, frame-src and worker-src 'self'
    #       because the SHELL DOCUMENT loads those things. A worker that is
    #       allowed to connect is the one thing this must not allow.
    #
    #   Strict-Transport-Security
    #       The same value Page::headers sends, and beside it mostly redundant:
    #       a browser remembers this per host, and nothing here is normally
    #       reached before the page. Redundant is not inert, though - it does
    #       what it says on every answer it is on - and the one request the page
    #       does not cover is somebody opening a file's address on its own.
    #       tests/shell/csp.spec.js holds both to ONE constant, so the page and
    #       the files cannot start saying different things about this host.
    #
    # DELIBERATELY NOT HERE, so that nobody puts them back in by reflex:
    #
    #   Referrer-Policy, Cross-Origin-Opener-Policy, Permissions-Policy
    #       All three govern a DOCUMENT - where it says it came from, what it
    #       shares a browsing context with, which devices it may ask for.
    #       Nothing below assets/ is a document: tests/shell/csp.spec.js holds
    #       the web root to carrying no .html, .svg or .php but the one entry
    #       point. On a .js they would be three headers that fence nothing.
    #
    #   Cache-Control
    #       Page::headers sends no-store because the page carries the session.
    #       These files carry nothing, and no-store would make every window
    #       fetch them again. What they SHOULD say instead belongs with the
    #       update story and is not decided here, so this block says nothing
    #       about caching rather than guessing.
    #
    # Only Header lines in this block, nothing else: apps/web/tests/mock/api.js
    # reads them out of this file and puts them on the test server's answers,
    # so that tests/shell/csp.spec.js measures THIS file and not a copy of it.
    <Directory "/var/www/ngc/public/assets">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set Content-Security-Policy "default-src 'none'; script-src 'self'"
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    </Directory>

    # The API servers. ngc-web writes this file and the controller with role
    # web keeps it up to date; its content - one BalancerMember per API, the
    # internal TLS settings and /api/ including the WebSocket - is laid down in
    # shared/ulh.md ("Lastverteilung in Apache"). It is included and not
    # written out here, because nothing but those two may write it.
    #
    # Include and not IncludeOptional: if the file is missing, Apache says so
    # by name when it starts. A shell whose API is silently absent says far
    # less.
    Include /etc/ngc/apache-apis.conf

    # php-fpm instead of libapache2-mod-php: switch the proxy_fcgi module on
    # (a2enmod proxy_fcgi) and take the three lines below out of the comment.
    # The socket is the one your PHP version brings; 8.2 on Debian 12 has this
    # name.
    #<FilesMatch "\.php$">
    #    SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    #</FilesMatch>
</VirtualHost>
