# The Apache virtual host of the NGC web interface.
#
# WHAT IT IS FOR. public/index.php says "Apache's DocumentRoot is this folder
# and serves everything below assets/ itself". Until this file existed the
# repository never said what that Apache looks like, so whoever set NGC up
# invented it - and the files below assets/ went out with no wall of their own,
# because classes/Page.php only ever reaches the answers index.php writes.
#
# HOW TO USE IT. Six commands, in this order, as root. Nothing in here has to
# be understood first, and nothing has to be filled in but the one name. The
# whole thing assumes Debian 12 or Ubuntu 24.04 and a fresh machine.
#
# Replace ngc.example.com with the name this server answers to - everywhere,
# including in the commands:
#
#   1. The interface, and a place for its configuration:
#        mkdir -p /var/www/ngc /etc/ngc/tls
#        # unpack the release into /var/www/ngc, so that
#        # /var/www/ngc/public/index.php exists
#        apt install -y libapache2-mod-php
#
#   2. A certificate, so that Apache can start at all. Self-signed, one
#      command, valid for two years. The price in one sentence: every browser
#      warns until step 6 has put a real one there.
#        openssl req -x509 -newkey rsa:4096 -sha256 -days 730 -nodes \
#          -keyout /etc/ngc/tls/web.key -out /etc/ngc/tls/web.crt \
#          -subj "/CN=ngc.example.com" -addext "subjectAltName=DNS:ngc.example.com"
#        chmod 600 /etc/ngc/tls/web.key
#
#   3. An empty file for the API servers. The Include at the end of this file
#      is hard on purpose, so an empty one has to exist before Apache starts;
#      see the comment there.
#        touch /etc/ngc/apache-apis.conf
#
#   4. This file, with the name filled in:
#        cp /var/www/ngc/templates/apache-vhost.conf \
#           /etc/apache2/sites-available/ngc-web.conf
#        sed -i 's/NGC-HOSTNAME/ngc.example.com/g' \
#           /etc/apache2/sites-available/ngc-web.conf
#
#   5. The two settings that are not allowed in this file, then switch it on.
#      Each sed has a line after it that must print what it says, because a sed
#      that matched nothing is the kind of failure nobody notices:
#        sed -i -E 's/^#?[ \t]*ServerTokens[ \t]+.*/ServerTokens Prod/' \
#           /etc/apache2/conf-available/security.conf
#        grep -c '^ServerTokens Prod' /etc/apache2/conf-available/security.conf
#        # must print: 1
#        sed -i -E 's/^;?[ \t]*expose_php[ \t]*=.*/expose_php = Off/' \
#           /etc/php/*/apache2/php.ini
#        grep -h '^expose_php' /etc/php/*/apache2/php.ini
#        # must print: expose_php = Off
#        a2enmod ssl headers rewrite proxy proxy_http proxy_balancer \
#                proxy_wstunnel lbmethod_byrequests
#        a2ensite ngc-web
#        apachectl configtest && systemctl restart apache2
#
#      apachectl configtest answers "Syntax OK" or names the line it does not
#      like, and nothing is started before it does. restart and not reload: on
#      a fresh machine Apache may not be running yet, and reload on a stopped
#      service fails.
#
#      NGC answers on https://ngc.example.com/ from here on, with the warning
#      about the certificate from step 2.
#
#   6. A real certificate, with Apache running - the virtual host for port 80
#      below leaves free the one path Let's Encrypt asks for. Six commands, no
#      line of them continued, so there is nothing to get wrong:
#        apt install -y certbot
#        certbot certonly --webroot -w /var/www/html -d ngc.example.com
#        ln -sf /etc/letsencrypt/live/ngc.example.com/fullchain.pem /etc/ngc/tls/web.crt
#        ln -sf /etc/letsencrypt/live/ngc.example.com/privkey.pem /etc/ngc/tls/web.key
#        printf '#!/bin/sh\nsystemctl reload apache2\n' > /etc/letsencrypt/renewal-hooks/deploy/ngc.sh
#        chmod 700 /etc/letsencrypt/renewal-hooks/deploy/ngc.sh
#        systemctl reload apache2
#
#      Two links instead of two copies, so that a renewal needs no copying: the
#      certificate behind them is replaced and the two paths this file names
#      keep pointing at it. The hook is the other half - certbot renews on its
#      own from now on, and that one line makes Apache pick the new certificate
#      up. Without it NGC would serve an expired certificate until the next
#      restart. Nothing in this file has to be touched again.
#
# The modules in step 5 are the ones this file and the API's own file need.
# mod_dir is needed as well, for FallbackResource; on Debian it is switched on
# from the start, which is why it is not in the line. Nothing here uses
# mod_alias.
#
# ngc-web.conf is the name on purpose: scripts/ngc-web.sh in the ulh repository
# writes its virtual host under exactly that name, so a machine never ends up
# with two of them quarrelling over one ServerName. What that costs is in the
# next section - it is not only a good thing.
#
# On a server that ulh set up none of this is done by hand: scripts/ngc-web.sh
# in the ulh repository does it (shared/ulh.md).
#
# WHERE THIS FILE AND ngc-web.sh DO NOT AGREE YET - all four differences, the
# two that go for this file and the two that go against it. As this file is
# written, ngc-web.sh writes a virtual host of its own and is one task older.
#
# For this file:
#   - It sets NO header for the files below assets/, only the same
#     Strict-Transport-Security, for the whole host. That is the hole this file
#     closes, so ngc-web.sh has to take over the assets block below.
#   - It routes the whole interface to index.php with mod_rewrite and takes
#     /assets/ OUT of that rewrite, so a MISSING file there is answered by
#     Apache itself: a bare error page with none of the walls below but that
#     one. This file uses FallbackResource for the routing instead - mod_rewrite
#     only on port 80, for the certificate path - and lets a missing file reach
#     index.php, which answers 404 with every header Page::headers sends.
#     tests/shell/csp.spec.js measures that path.
#
# Against this file:
#   - The certificate. ngc-web.sh lets mod_md (MDomain, in a conf-available
#     file of its own, because MDomain is not allowed in a virtual host) fetch
#     and renew it, which is one moving part fewer than step 6 above. Step 6
#     is written the way it is because certbot needs no new Apache module and
#     its deploy hook is visible in one place; mod_md is the tidier of the two.
#   - ngc-web.sh OVERWRITES /etc/apache2/sites-available/ngc-web.conf on every
#     install and every configure (put_file), and its own first line says
#     "Never edit by hand". So a machine that was set up by hand and then has
#     ulh run on it LOSES the assets block below, without a warning and
#     without a test noticing. Until ngc-web.sh carries the block itself, that
#     is the order of events to avoid - and if it has happened, step 4 above
#     puts the file back.
#
# Until then the file that ships on a server is the script's. This one is the
# reference, because it is the one a test measures.
#
# WHAT NO TEST IN THIS REPOSITORY MEASURES, because there is no Apache in it:
# whether Apache reads this file at all, and whether it applies it as it is
# meant. Everything below is reasoned from the documented behaviour of Apache,
# never measured. Five curl commands settle it in about a minute on the first
# machine that has one, and apps/web/README.md lists them with the answer each
# one has to give ("What no test here can measure"). The one that matters most
# is the last: whether "Header always set" adds a second header instead of
# replacing.

# ------------------------------------------------------------------- plain http
#
# Almost nothing is answered here. NGC needs https for the login (WebAuthn
# works nowhere else), so a request that arrives without TLS is sent on.
#
# ONE PATH IS NOT SENT ON, and leaving it out is what breaks a server after
# ninety days: Let's Encrypt proves a name by fetching
# /.well-known/acme-challenge/… over PLAIN http. Redirect every path and the
# first certificate still works (nothing is running yet) while every RENEWAL
# fails - certbot can no longer use --standalone, because Apache holds port 80,
# and no longer --webroot, because the answer is a redirect. So the one path
# stays, served out of the stock DocumentRoot that certbot writes into.
# ngc-web.sh keeps the same path free for mod_md.
<VirtualHost *:80>
    ServerName NGC-HOSTNAME
    DocumentRoot "/var/www/html"
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName NGC-HOSTNAME

    SSLEngine on
    # These two paths and not Let's Encrypt's own, for two reasons: ngc-web.sh
    # names exactly these, so a machine set up either way looks the same; and
    # the certificate may be swapped - self-signed in step 2, the real one in
    # step 6 - without this file changing. Step 6's deploy hook copies into
    # them on every renewal.
    SSLCertificateFile    /etc/ngc/tls/web.crt
    SSLCertificateKeyFile /etc/ngc/tls/web.key
    # TLS 1.3 and nothing else. The price, in one sentence: a browser older
    # than about 2018 cannot connect - and such a browser cannot log in to NGC
    # anyway, because it has neither WebAuthn nor the keys the session needs.
    SSLProtocol -all +TLSv1.3

    # The server says nothing about itself. Two halves of this are NOT here,
    # because neither is allowed in a virtual host - they are the two sed lines
    # of step 5: ServerTokens Prod in the server-wide configuration, and
    # expose_php = Off in php.ini. classes/Page.php already removes
    # X-Powered-By from every answer it writes, so expose_php is about the
    # answers PHP gives WITHOUT reaching it: a fatal error, a request that
    # never got to index.php.
    ServerSignature Off

    DocumentRoot "/var/www/ngc/public"

    # WHAT MAY NOT BE SERVED, said twice: once by DocumentRoot pointing at
    # public/ and nothing else, and once here. The second time is the one that
    # survives a typo in the first.
    #
    # The rule is EVERYTHING beside public/, not a list - Require all denied
    # covers whatever is or ever will be there. These are the ones a reader
    # looks for:
    #   classes/    the PHP that reads the configuration and sends the headers
    #   config/     settings
    #   data/       runtime data
    #   templates/  the page skeletons, and this file
    #   assets/     the pages of the apps NGC ships. They are NOT under
    #               public/ on purpose: an .html under public/ would be a
    #               document of the shell's own origin, with the shell's
    #               storage, cookies and session in reach - which is exactly
    #               what an app window takes away from an app.
    #   tests/      the browser tests, with node_modules/ in them. A release
    #               does not carry them; a checkout does, and then this is the
    #               folder with the most files behind it.
    #   VERSION     the only file above public/ whose content goes out, and
    #               index.php reads it and checks it before it does
    #   README.md, CLAUDE.md and anything else that turns up: same rule
    #
    # This closes the way in over http and nothing else. index.php goes on
    # reading classes/, templates/ and VERSION off the file system the way it
    # always did - that is PHP opening a file, not a request Apache answers.
    <Directory "/var/www/ngc">
        Require all denied
        AllowOverride None
        Options None
    </Directory>

    <Directory "/var/www/ngc/public">
        Require all granted
        # No .htaccess anywhere: a file in the tree must not be able to loosen
        # what stands here. tests/shell/csp.spec.js holds the web root to
        # carrying no .ht* file either.
        AllowOverride None
        # No directory listing, and no symbolic link out of the web root. The
        # price: if your installation puts a link into public/ instead of the
        # file, Apache refuses it - copy the file.
        Options -Indexes -FollowSymLinks -ExecCGI -Includes
        # Every path that EXISTS AS NEITHER a file NOR a directory below
        # public/ goes to the one entry point, which is what index.php's
        # comment describes. A missing file under assets/ lands there too, so
        # index.php answers it - with the 404 of the shell and the headers
        # classes/Page.php sends, instead of Apache's own bare error page.
        #
        # A DIRECTORY is the exception and does NOT come here: FallbackResource
        # only catches a path that is not there, and /assets/js/ is there. That
        # one mod_dir answers itself, with 403 because of -Indexes above. It is
        # no hole - the block below puts its four headers on that answer too,
        # and there is no listing to be had - but the sentence would be wrong
        # without this one.
        #
        # ONE THING IS NOT MEASURED HERE, because this repository has no Apache
        # to measure: whether the assets block below ALSO reaches the fallback
        # answer. If it does, the result is not a replacement but a SECOND
        # Content-Security-Policy beside the one Page::headers sent (see the
        # note on "always" in that block), which a browser reads as the
        # intersection of the two - stricter, not weaker. Either way the answer
        # carries a policy beginning with default-src 'none', nosniff and the
        # resource policy, and that is what tests/shell/csp.spec.js holds that
        # path to.
        FallbackResource /index.php
    </Directory>

    # THE WALLS FOR THE FILES APACHE HANDS OUT ITSELF.
    #
    # Everything below is a file no PHP ever sees: a .js, a .css, the vendored
    # code, and the LICENSE beside it. classes/Page.php cannot reach them, so
    # their walls stand here - and they are NOT the same walls, because a file
    # is not a document and a header written for a document can be wrong for a
    # file. What each one does here was checked, not copied:
    #
    #   X-Content-Type-Options: nosniff
    #       Needed, and one file in the tree proves it:
    #       assets/vendor/noble-hashes/LICENSE has no extension. Measured on
    #       the test server, it goes out with NO Content-Type at all; Apache
    #       2.4 answers the same way, because it has no DefaultType either and
    #       sends no type it cannot look up. Without nosniff the browser is
    #       then free to guess what it is holding, and a file read as something
    #       other than what it is has been the whole attack often enough.
    #
    #   Cross-Origin-Resource-Policy: same-origin
    #       Needed. Without it any page anywhere may pull the shell's files
    #       into itself. They carry no secret, but they are the shell's, and
    #       what is embedded can be measured.
    #
    #   Content-Security-Policy
    #       A policy OF ITS OWN, not Page::CSP, and its two directives are all
    #       there is on purpose. The value is NOT repeated here: it stands once,
    #       in the block below, and apps/web/tests/mock/api.js reads it from
    #       there. A second copy in a comment is a copy nothing holds together.
    #
    #       For a .js or a .css that a document FETCHES this header does
    #       nothing at all - the policy that governs a sub-resource is the
    #       document's, not the file's. It would be decoration, and a header
    #       that feigns a wall is worse than no header.
    #
    #       It is here for the one file where it is NOT decoration: a worker's
    #       policy is its OWN response's. assets/js/auth/argon2-worker.js is
    #       the module worker that holds the typed password while it derives
    #       the key from it. These two directives let it load what it imports
    #       and let it do nothing else.
    #
    #       Both halves were measured, and they need both engines:
    #         - script-src 'self' is what keeps the worker working. With
    #           "default-src 'none'" ALONE, WebKit refuses the worker's static
    #           import outright - the worker never runs, so no password login
    #           works in Safari. Chromium is the quiet one: it lets the static
    #           import through and refuses only a dynamic import(). A header
    #           measured on one engine would have shipped the wrong value here.
    #         - connect-src is ABSENT, so default-src 'none' answers for it,
    #           and fetch out of such a worker is refused on both engines
    #           (measured). That is the wall that matters: no connection of its
    #           own, even if this file or something it imports were one day made
    #           to try.
    #           Exactly what it does NOT do, so the sentence is not read wider
    #           than it is: script-src 'self' still allows a dynamic import of
    #           a same-origin address, and an address is a GET that lands in
    #           Apache's access log. That leaves nothing of the password on
    #           another host, but it is not "nowhere". Closing it would mean
    #           taking script-src away, and that breaks the worker on WebKit -
    #           so this is the trade, named rather than hidden.
    #
    #       That is also why Page::CSP is wrong here: it says script-src,
    #       style-src, img-src, connect-src, frame-src and worker-src 'self'
    #       because the SHELL DOCUMENT loads those things. A worker that is
    #       allowed to connect is the one thing this must not allow.
    #
    #   Strict-Transport-Security
    #       The same value Page::headers sends, and beside it mostly redundant:
    #       a browser remembers this per host, and nothing here is normally
    #       reached before the page. Redundant is not inert, though - it does
    #       what it says on every answer it is on - and the one request the page
    #       does not cover is somebody opening a file's address on its own.
    #       tests/shell/csp.spec.js holds both to ONE constant, so the page and
    #       the files cannot start saying different things about this host.
    #
    # DELIBERATELY NOT HERE, so that nobody puts them back in by reflex:
    #
    #   Cross-Origin-Opener-Policy, Permissions-Policy
    #       Both govern a DOCUMENT - what it shares a browsing context with,
    #       which devices it may ask for. Nothing below assets/ is a document:
    #       tests/shell/csp.spec.js holds the web root to carrying no .html,
    #       .svg or .php but the one entry point. On a .js they fence nothing.
    #
    #   Referrer-Policy
    #       Left out for a NARROWER reason, and the wide one would have been
    #       wrong: it does not govern only documents. It belongs to any
    #       settings object, a worker's own answer included, and it says where
    #       the requests THAT object makes say they come from. Here it has
    #       nothing to govern, because the policy above leaves the worker no
    #       request to make - and a .js or .css that a document fetched makes
    #       none of its own at all. So: no effect, left out.
    #
    #   Cache-Control
    #       Page::headers sends no-store because the page carries the session.
    #       These files carry nothing, and no-store would make every window
    #       fetch them again. What they SHOULD say instead belongs with the
    #       update story and is not decided here, so this block says nothing
    #       about caching rather than guessing.
    #
    # WHAT "always" REALLY DOES, because this file said the wrong thing about
    # it once. It does NOT mean "replace whatever is there". It picks the table
    # of headers Apache uses for error answers (err_headers_out) instead of the
    # ordinary one, and a header already sitting in the ordinary table stays.
    # So where PHP has already sent one, the result is TWO headers and not one -
    # the known cure is a "Header always unset" in front of each line, and this
    # file does not carry one because nothing here could measure whether it
    # helps.
    #
    # Reachable on exactly one path: the fallback 404 above, if the block
    # reaches it at all. There two Content-Security-Policy headers are read as
    # the intersection of both - stricter, so no hole - while two
    # Cross-Origin-Resource-Policy headers are neither same-origin nor
    # same-site and so do nothing. That is the one thing worth measuring on the
    # first machine with an Apache; apps/web/README.md says with which command.
    # VERMUTUNG from the documented behaviour of mod_headers, NOT measured.
    #
    # ONLY Header lines in this block: apps/web/tests/mock/api.js reads them out
    # of this file and puts them on the test server's answers, so that
    # tests/shell/csp.spec.js measures THIS file and not a copy of it. The
    # reader is strict on purpose and refuses to start on a line it does not
    # understand - a wall it silently skipped would make a green test out of an
    # installation with a hole. If this block ever needs another directive, it
    # goes into the public/ block above, or the grammar in assetWalls() grows
    # with it; what must not happen is a line here that no test sees.
    <Directory "/var/www/ngc/public/assets">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set Content-Security-Policy "default-src 'none'; script-src 'self'"
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    </Directory>

    # The API servers. ngc-web writes this file and the controller with role
    # web keeps it up to date; its content - one BalancerMember per API, the
    # internal TLS settings and /api/ including the WebSocket - is laid down in
    # shared/ulh.md ("Lastverteilung in Apache"), and the form it writes is
    # apps/web/templates/apache-apis.conf.example beside this file. It is
    # included and not written out here, because by that rule nothing but those
    # two may write it.
    #
    # Include and not IncludeOptional: a missing file is then named by Apache
    # when it starts, instead of an NGC whose API is silently absent. The price
    # is that Apache does not start without it at all - which is why step 3
    # creates an EMPTY one. Empty is a working state: the shell comes up and
    # says it cannot reach an API, which is the truth on a machine that has
    # none yet. Do NOT copy the .example over it by hand - its BalancerMember
    # lines name hosts that do not exist, and Apache will not resolve them.
    Include /etc/ngc/apache-apis.conf

    # php-fpm instead of libapache2-mod-php: switch the proxy_fcgi module on
    # (a2enmod proxy_fcgi) and take the three lines below out of the comment.
    # The socket is the one your PHP version brings; 8.2 on Debian 12 has this
    # name.
    #<FilesMatch "\.php$">
    #    SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    #</FilesMatch>
</VirtualHost>
